<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Invoice – F &amp; W Coffee</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#f1e8d8;color:#2a1a12;font:15px/1.7 "Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif}
.tools{max-width:780px;margin:16px auto 0;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:11px 20px;background:#c98a2b;color:#2a1a12;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:#fff;border:1px solid #d9c6a6;font-weight:400}
.paper{max-width:780px;margin:16px auto 40px;background:#fff;border:1px solid #e4d3bb;border-radius:10px;padding:32px}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid #c98a2b;padding-bottom:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;color:#4a2a1a}
.brand img{width:56px;height:56px;object-fit:contain}
.meta{text-align:right}
.meta h1{margin:0;font-size:26px;color:#4a2a1a}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}
.cols h3{margin:0 0 4px;font-size:13px;color:#6f5848;text-transform:uppercase}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 6px;border-bottom:1px solid #e4d3bb;text-align:left}
th{background:#f7efe2;font-size:13px}
.r{text-align:right}
.total td{font-weight:700;font-size:18px;border-bottom:0;border-top:2px solid #4a2a1a}
.foot{margin-top:24px;text-align:center;color:#6f5848;font-size:14px}
.msg{max-width:780px;margin:40px auto;text-align:center;padding:0 16px}
.badge{display:inline-block;border:1px solid #6f5848;border-radius:99px;padding:0 10px;font-size:13px}
@media (max-width:560px){.cols{grid-template-columns:1fr}.meta{text-align:left}.paper{padding:18px}}
@media print{
  body{background:#fff}.tools{display:none}
  .paper{margin:0;border:0;border-radius:0;max-width:none;padding:0}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div class="tools" id="tools" hidden>
  <button class="btn" id="pdf">PDF ဖြင့် သိမ်းရန် / ပရင့်ထုတ်ရန်</button>
  <a class="btn ghost" href="/">ဆိုင်သို့ ပြန်သွားရန်</a>
</div>
<div class="msg" id="msg">ပြေစာ ရယူနေပါသည်… (ဆာဗာ နိုးထနေလျှင် စက္ကန့် ၃၀ ခန့် ကြာနိုင်သည်)</div>
<div class="paper" id="paper" hidden></div>

<script src="config.js"></script>
<script>
const API = (window.FW_API || "").replace(/\/+$/, "");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ks = n => Number(n).toLocaleString("en-US") + " Ks";
const P = new URLSearchParams(location.search);
const id = P.get("id"), t = P.get("t");

(async () => {
  if (!id || !t) { $("#msg").textContent = "ပြေစာလင့်ခ် မမှန်ကန်ပါ။"; return; }
  let o;
  try {
    const r = await fetch(`${API}/api/orders/${encodeURIComponent(id)}?t=${encodeURIComponent(t)}`);
    o = await r.json();
    if (!r.ok) throw 0;
  } catch { $("#msg").textContent = "ပြေစာ ရှာမတွေ့ပါ သို့မဟုတ် ချိတ်ဆက်၍ မရပါ။ ခဏနေပြီး ပြန်ကြိုးစားပါ။"; return; }

  const no = "INV-" + String(o.id).padStart(6, "0");
  document.title = no + " – F & W Coffee";
  const date = new Date(o.created_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  $("#paper").innerHTML = `
    <div class="head">
      <div class="brand"><img src="https://ik.imagekit.io/vjlvspano/F&W/logo_2-removebg-preview.png" alt="" onerror="this.style.display='none'"><span>F &amp; W Coffee<br><small style="font-weight:400;font-size:13px">Mr Viet Coffee</small></span></div>
      <div class="meta"><h1>ပြေစာ / INVOICE</h1><div><b>${no}</b></div><div>${esc(date)}</div><div><span class="badge">${esc(o.status)}</span></div></div>
    </div>
    <div class="cols">
      <div><h3>ဝယ်သူ</h3><div><b>${esc(o.name)}</b></div><div>${esc(o.phone)}</div><div>${esc(o.addr)}</div></div>
      <div><h3>ငွေပေးချေမှု</h3><div>${esc(o.pay)}</div></div>
    </div>
    <table>
      <thead><tr><th>ပစ္စည်း</th><th class="r">ဈေးနှုန်း</th><th class="r">အရေအတွက်</th><th class="r">ကျသင့်ငွေ</th></tr></thead>
      <tbody>${o.items.map(i => `<tr><td>${esc(i.name)}</td><td class="r">${ks(i.price)}</td><td class="r">${i.qty}</td><td class="r">${ks(i.price * i.qty)}</td></tr>`).join("")}</tbody>
      <tfoot><tr class="total"><td colspan="3" class="r">စုစုပေါင်း</td><td class="r">${ks(o.total)}</td></tr></tfoot>
    </table>
    <p class="foot">ဝယ်ယူအားပေးမှုအတွက် ကျေးဇူးတင်ပါသည်။ ကျွန်ုပ်တို့ ဖုန်းဖြင့် ဆက်သွယ်ပါမည်။</p>`;
  $("#msg").hidden = true; $("#paper").hidden = false; $("#tools").hidden = false;
})();
$("#pdf").onclick = () => window.print();
</script>
</body>
</html>
